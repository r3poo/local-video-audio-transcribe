[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "python-whisper"
version = "0.1.0"
description = "Local video/audio transcription with sherpa-onnx and PyAV, plus a built-in web UI"
readme = "README.md"
requires-python = ">=3.10"
# No licence is asserted yet. Pick one, add a LICENSE file, then set e.g. license = "MIT".
keywords = [
  "asr",
  "speech-to-text",
  "transcription",
  "subtitles",
  "sherpa-onnx",
  "whisper",
  "parakeet",
  "cli",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
  # Media demux/decoding with bundled FFmpeg libraries - no system ffmpeg needed.
  "av>=12,<21",
  "numpy>=1.26,<3",
  # ONNX Runtime speech engine. PyPI wheels are CPU-only; see the note at the
  # bottom of this file for the CUDA build.
  "sherpa-onnx>=1.12,<2",
  # The bindings wheel holds no runtime: onnxruntime.dll / libonnxruntime.so /
  # libonnxruntime.dylib comes from this companion wheel, and the two must be the
  # same release. The wheel's own Requires-Dist pins it, but the metadata uv
  # resolves from PyPI's JSON omits it, so without this line `uv sync` installs
  # the bindings alone and sherpa-onnx binds to whichever onnxruntime the system
  # offers - on Windows that is the ONNX Runtime 1.17.1 copy in System32, which
  # dies with "requested API version [28] is not available, only [1, 17]".
  # Bump both lines together when upgrading the engine.
  "sherpa-onnx-core==1.13.8",
]

[project.scripts]
python-whisper = "whisper_pipeline.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["whisper_pipeline"]

[dependency-groups]
dev = ["ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4"]

[tool.ruff.format]
quote-style = "double"

# GPU (NVIDIA CUDA) engine - Linux x86_64. The k2-fsa wheels are tagged with the ONNX
# Runtime they bundle, e.g.
#   sherpa_onnx-1.13.8+cuda12.cudnn9.onnxruntime1.28.2-cp313-cp313-linux_x86_64.whl
# The "+cuda" wheels WITHOUT an onnxruntimeX.Y.Z tag link against an externally
# installed onnxruntime instead, which is how you get
#   "requested API version [28] is not available, only [1, 17] are supported"
# (bindings compiled against ORT 1.28 loading a 1.17 runtime).
#
# 1) drop the CPU engine and any stray onnxruntime copy - the CUDA wheel bundles its own
#      uv pip uninstall sherpa-onnx sherpa-onnx-core onnxruntime onnxruntime-gpu
# 2) install the tagged wheel matching YOUR python tag / CUDA / cuDNN:
#      uv pip install "https://huggingface.co/csukuangfj2/sherpa-onnx-wheels/resolve/main/cuda/1.13.8/sherpa_onnx-1.13.8+cuda12.cudnn9.onnxruntime1.28.2-cp313-cp313-linux_x86_64.whl"
# 3) verify: providers must include 'cuda', and onnxruntime_version must match the tag
#      uv run python -c "import sherpa_onnx as so; from whisper_pipeline.models import available_providers as p; print(p(), so.onnxruntime_version)"
#
# `uv sync` restores the CPU engine, so make the GPU wheel declarative if you want it to
# survive: add, then re-lock and sync.
#
#   [tool.uv.sources]
#   sherpa-onnx = { url = "https://huggingface.co/csukuangfj2/sherpa-onnx-wheels/resolve/main/cuda/1.13.8/sherpa_onnx-1.13.8+cuda12.cudnn9.onnxruntime1.28.2-cp313-cp313-linux_x86_64.whl" }
#
# requirements-gpu.txt covers the plain-pip route.
